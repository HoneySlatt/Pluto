[package]
name = "pluto"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [".", "crates/pluto-core", "crates/pluto-ffi", "crates/uniffi-bindgen"]

[dependencies]
pluto-core = { path = "crates/pluto-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
libc = "0.2"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit"] }
egui_extras = { version = "0.36.2", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "bmp", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
skrifa = "0.44"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
unicode-segmentation = "1"
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
vte = "0.15"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot", "eframe"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
