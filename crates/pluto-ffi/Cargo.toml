[package]
name = "pluto-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Pluto's core for the Android app: the session with the server and the screens' data, exposed to Kotlin through UniFFI."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pluto-core = { path = "../pluto-core" }
pulldown-cmark = { version = "0.13", default-features = false }
# SVG favicons and the providers' marks, rendered to PNG (no text).
resvg = { version = "0.49", default-features = false }
serde_json = "1"
uniffi = "0.32"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
