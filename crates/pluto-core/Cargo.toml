[package]
name = "pluto-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pluto's connection to the server and its conversation model, shared by the desktop and mobile clients."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
