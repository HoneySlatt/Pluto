[package]
name = "pluto-fake-model"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "A scripted fake model service: streams the same answers to any application over Anthropic's, OpenAI's and Ollama's APIs, and counts what it receives, so that Pluto and its rivals are measured on one workload."

[dependencies]
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
