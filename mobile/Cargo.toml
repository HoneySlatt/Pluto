[package]
name = "pluto-mobile"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pluto on Android: the Code and Chat spaces of a Pluto server."

# The launcher label (dx derives it from the executable name).
[[bin]]
name = "Pluto"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The phone renders through the Android WebView; elsewhere the crate builds
# without a renderer so its unit tests run on the computer.
dioxus = { version = "0.7", default-features = false, features = ["document", "hooks", "html", "launch", "macro", "signals", "asset"] }
futures-channel = "0.3"
futures-util = "0.3"
iana-time-zone = "0.1"
pluto-core = { path = "../crates/pluto-core" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[build-dependencies]
serde_json = "1"
toml = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
dioxus = { version = "0.7", features = ["mobile"] }
jni = "0.21"
ndk-context = "0.1"
